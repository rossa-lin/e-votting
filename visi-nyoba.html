<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visi Misi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url('background-utama.png') center/cover no-repeat;
    }

    /* NAVBAR */
    nav {
      height: 60px;
      background: #701F31;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .logo img {
      width: 150px;
    }

    /* LAYOUT */
    .main {
      display: flex;
    }

    /* SIDEBAR */
    .side-bar {
      width: 230px;
      height: calc(100vh - 60px);
      background: #701F31;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .menu button {
      width: 100%;
      height: 40px;
      border-radius: 30px;
      border: none;
      background: #EBD4C1;
      font-weight: 600;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .menu button:hover {
      background: #d6b9a5;
    }

    .user {
      color: #EBD4C1;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .logout button {
      width: 100%;
      height: 40px;
      border-radius: 30px;
      border: none;
      background: #EBD4C1;
      font-weight: 600;
      cursor: pointer;
    }

    /* CONTENT */
    .content {
      flex: 1;
      padding: 40px;
    }

    .judul {
      text-align: center;
      color: #EBD4C1;
      margin-bottom: 20px;
    }

    .kandidat-isi {
      background: #EBD4C1;
      border-radius: 30px;
      padding: 30px;
      max-width: 800px;
      margin: auto;
    }

    .kandidat-1 {
      text-align: center;
      color: #701F31;
    }

    .nama {
      text-align: center;
      color: #701F31;
      margin-bottom: 20px;
    }

    .img-desk {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .foto img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
    }

    .deskripsi {
      font-size: 14px;
      color: #333;
      text-align: justify;
    }

    .button-1 {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .button-1 button {
      width: 120px;
      height: 35px;
      border-radius: 10px;
      border: none;
      color: #EBD4C1;
      font-weight: bold;
      cursor: pointer;
    }

    .vote {
      background: #571C21;
    }

    .back {
      background: #851521;
    }

  </style>
</head>
<body>

  <nav>
    <div class="logo">
      <img src="Logo PilihAja.png" alt="logo">
    </div>
  </nav>

  <div class="main">

    <div class="side-bar">
      <div class="menu">
        <button>Voting</button>
        <button>Hasil Voting</button>
      </div>

      <div>
        <div class="user">Hi, 1234!</div>
        <div class="logout">
          <button>Log out</button>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="judul">
        <h1>Visi Misi</h1>
      </div>

      <div class="kandidat-isi">
        <div class="kandidat-1">
          <h2>Detail Kandidat 1</h2>
        </div>

        <div class="nama">
          <h3>Deswita M</h3>
        </div>

        <div class="img-desk">
          <div class="foto">
            <img src="deswita2.jpeg">
          </div>

          <div class="deskripsi">
            <p>Saya memiliki visi untuk menjadikan kelas yang aktif, kreatif, dan berprestasi dalam berbagai bidang. Saya ingin mengajak teman-teman untuk lebih berpartisipasi dalam kegiatan sekolah.</p>
          </div>
        </div>

        <div class="button-1">
          <button class="vote">Voting</button>
          <button class="back">Kembali</button>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
