<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting disimpan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "poppins";
      }

      nav {
        background: #701f31;
        box-shadow: 0 0 5px black;
        height: 55px;
        width: 1280px;
        margin-top: -10px;
        margin-left: -10px;
        margin-right: -10px;
      }

      .logo img {
        margin-top: -35px;
        margin-left: -25px;
      }

      body {
        background-image: url("background-utama.png");
        color: white;
      }

      .sidebar {
        background-color: #701F31;
        width: 100px;
        height: 520px;
      }

      .popup {
        background-color: #ebd4c1;
        width: 500px;
        height: 240px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 20px;
        text-align: center;
      }

      .toa img {
        position: absolute;
        width: 150px;
        height: 150px;
        align-items: center;
        top: -85px;
        right: 153px;
      }

      .pesan p {
        color: #701f31;
        text-align: center;
        font-size: 25px;
      }

      .kembali h5 {
        color: #701f31;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav>
      <div class="logo">
        <img src="Logo PilihAja.png" alt="" width="200px" />
      </div>
    </nav>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="button">
        <button><span>Voting</span></button>
      </div>
      <div class="button">
        <button><span>Hasil Voting</span></button>
      </div>

      <div class="button">
        <p>Hi, 1234!</p>
        <button><span>Log out</span></button>
      </div>
    </div>

    <!--Notification-->
    <div class="notif">
      <div class="popup">
        <div class="toa">
          <img src="toaa.png" alt="" />
        </div>
        <div class="pesan">
            <p>
            Pilihan anda sudah kami simpan! Terima kasih sudah berpartisipasi
              dalam pemilihan ini.
          </p>
        </div>
        </div>
      </div>
    </div>

    <div class="kembali">
      <button
        style="
          height: 30px;
          width: 160px;
          border-radius: 10px;
          background-color: #ebd4c1;
          border: 10px;
        "
      >
        <h5>Kembali ke Halaman Log in</h5>
      </button>
    </div>
  </body>
</html>
