<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
     
  <style>
    .navbar {
      width: auto;
      height: 65px;
      background: #701F31;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 3px solid rgba(0, 0, 0, 0.15);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }
    .logo img {
      width: 165px;
      height: auto;
      object-fit: contain;
      display: block;
    }
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }
    body{
      background-image: url(background-utama.png);
      color: #E4CBBA;
    }
    .side-bar {
      background: #701F31;
      width: 230px;
      position: fixed;
      top: 55px;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 20px 20px; 
    }
        .side-bar button {
            width: 100%;
            height: 40px;
            border-radius: 30px;
            border: none;
            background: #EBD4C1;
            font-size: 18px;
            font-weight: bold;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
            
        }
         .bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

    </style>

</head>
<body>
    <nav class="navbar">
    <div class="logo">
      <img src="Logo PilihAja.png" alt="">
    </div>
  </nav>
   <div class="side-bar">

            <div class="menu">
                <button>Voting</button>
                <button>Hasil Voting</button>
            </div>

            <div class="bottom">
                <div class="user">Hi, 1234!</div>
                <button>Log out</button>
            </div>
    
</body>
</html>
