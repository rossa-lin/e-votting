<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting disimpan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "poppins";
      }

      nav {
        background: #701F31;
        box-shadow: 0 0 5px black;
        height: 55px;
        width: 1290px;
        margin-top: -10px;
        margin-left: -10px;
        margin-right: -10px;
      }

      /* SIDEBAR */
      .side-bar {
            background: #701F31;
            width: 230px;
            position: fixed;
            top: 47px;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px 20px; 
      }
      .side-bar button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 40px;
            border-radius: 30px;
            background: #EBD4C1;
            color: #571C21;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
      }

        .side-button:hover {
            background: #CA757D;
            color: white;
            transform: scale(1.05);
        }

      .notif{
        display: flex;
        justify-content: center;
        margin-top: 150px;
        margin-left: 200px;
      }

      .logo img {
        margin-top: -35px;
        margin-left: -25px;
      }

      body {
        background-image: url("background-utama.png");
        color: white;
      }

      .popup {
        background-color: #ebd4c1;
        width: 510px;
        height: 260px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 20px;

      }

      .toa img {
        position: absolute;
        width: 180px;
        height: 180px;
        align-items: center;
        top: -100px;
        right: 153px;
      }

      .pesan p {
        color: #701f31;
        text-align: center;
        font-size: 25px;
      }

      .kembali {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        margin-left: 200px;
      }

      .kembali-btn {
        height: 40px;
        width: 200px;
        border-radius: 10px;
        background-color: #ebd4c1;
        border: 10px;

        background-color: #ebd4c1;
        border-radius: 30px;
        transition: 0.3s;
      }

      .kembali-btn:hover {
        background: #CA757D ;
      }

      .kembali h4 {
        color: #701f31;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav>
      <div class="logo">
        <img src="Logo PilihAja.png" alt="" width="200px" />
      </div>
    </nav>

    <!-- SIDEBAR -->
    <div class="side-bar">
        <div class="menu">
            <button>Voting</button>
            <button>Hasil Voting</button>
        </div>

        <div class="bottom">
            <div class="user">Hi, 1234!</div>
            <button>Log out</button>
        </div>
    </div>

    <!--Notification-->
    <div class="notif">
      <div class="popup">
        <div class="toa">
          <img src="toaa.png" alt="" />
        </div>
        <div class="pesan">
            <p>
            Pilihan anda sudah kami simpan!</p>
            <p>Terima kasih sudah berpartisipasi</p>
            <p>dalam pemilihan ini.</p>
          </p>
        </div>
        </div> 
      </div>
    </div>

    <div class="kembali">
      <button class="kembali-btn">
        <h4>Kembali ke Halaman Log in</h4>
      </button>
    </div>
  </body>
</html>
