<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
     
  <style>
    .teks-judul {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .title {
      text-align: center;
      margin-bottom: 10px;
    }
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }
    body{
      background-image: url(background-utama.png);
      color: #E4CBBA;
    }
    .teks{
        font-size: 16px;
        text-align:start;
        color: #482119;
        width: 100%;
        margin-bottom: 30px;
    }
    .container{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:80px;
        margin-top:60px;
    }
    .card{
        background:#e8d0bf;
        padding:40px;
        border-radius:25px;
        width:416px;
        height: 324px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }
    .login-btn{
        display: block;
        margin:auto;
        background: #8a3d4a;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 10px 26px;
        font-size: 16px;
        font-weight: bold;
  
    }
    .input-box {
        width: 100%;
        height: 51px;
        border: 1px solid #5b2d2d;
        border-radius: 20px;
        display: flex;
        align-items: center;
        padding: 0 25px;
        gap: 20px;
        margin-top:10px;
        margin-bottom: 30px;
    }
    .input-box i {
        color: #7a120d;
    }
    .input-box input {
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
        color: #b3877d;
        width: 100%;

    }
    .input-box input::placeholder {
        color: #b3877d;
    }

  </style>
</head>

<body>
  <div class="teks-judul">
    <div class="title">
    <h1>E-Voting Ketua Kelas </h1>
    <p>XI RPL 2 SMKN 1 Kandeman</p>
  </div>
  
  <div class="container">
    <div class="card">
    <div class="teks">
          <p>Masukkan NIS Anda</p>
          <div class="input-box">
          <i class="hgi hgi-stroke hgi-user"></i>
          <input type="text" placeholder="NIS">
        </div>

    <div class="teks">
          <p>Masukkan Kode Anda</p>
          <div class="input-box">
             <i class="hgi hgi-stroke hgi-square-lock-02"></i>
          <input type="text" placeholder="Kode">
        </div>
        
    <button class="login-btn">Login</button>
    </div>

</div>
</body>
</html>
