<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Kandidat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "poppins";
      }

      body {
            font-family: 'Poppins';
            background-image: url('background-utama.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            
      }

      nav {
        background: #701F31;
        box-shadow: 0 0 5px black;
        height: 55px;
        width: 1290px;
        margin-top: -10px;
        margin-left: -10px;
        margin-right: -10px;
      }

      .logo img {
        margin-top: -30px;
        margin-left: -25px;
      }

      /* LAYOUT */
      .side-bar {
            background: #701F31;
            width: 230px;
            position: fixed;
            top: 47px;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px 20px; 
      }
      .side-bar button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 40px;
            border-radius: 30px;
            background: #EBD4C1;
            color: #571C21;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
      }

        .side-button:hover {
            background: #CA757D;
            color: white;
            transform: scale(1.05);
        }

      .judul{
        margin-left: 220px;
        padding-top: 10px;
      }

      .judul h1 {
        color: #ebd4c1;
        text-align: center;
        font-size: 55px;
      }

      .kandidats {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-left: 220px;
        margin-top: 30px;
        flex-wrap: wrap;
      }

      .kandidat img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        margin-top: 10px;
        margin-bottom: 20px;
      }

      .profil {
        background-color: #ebd4c1;
        padding-top: 25px;
        padding-bottom: 35px;
        padding-left: 30px;
        padding-right: 30px;
        border-radius: 30px;
        width: 270px;
        height: 390px;
    
        display: flex;
        flex-direction: column;
        align-items: center;

      }

      .profil h1 {
        color: #6f120b;
        text-align: center;
        margin-top: 15px;
      }

      .profil h3 {
        color: #6f120b;
        text-align: center;
        margin-top: -5px;
      }

      .detail {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      .detail h4 {
        color: #ebd4c1;
        text-align: center;
      }
      .bottom {
        margin-bottom: 20px;
        text-align: center;
    }
    .menu {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav>
      <div class="logo">
        <img src="Logo PilihAja.png" alt="" width="200px" />
      </div>
    </nav>

    <!-- KANDIDAT -->
    <div class="judul">
      <h1>Daftar Kandidat</h1>
    </div>

    <div class="kandidats">
      <!-- KANDIDAT 1 -->
      <div class="kandidat">
        <div class="profil">
          <img src="deswita2.jpeg" alt="" />
          <h1>Kandidat 1</h1>
          <h3>Deswita M</h3>

          <div class="detail">
            <button
              style="
                height: 30px;
                width: 110px;
                margin-top: 10px;
                border-radius: 10px;
                background-color: #723238;
                border: 0px;
                font-size: 20px;
              "
            >
              <h4>Detail</h4>
            </button>
          </div>
        </div>
      </div>

      <!-- KANDIDAT 2 -->
      <div class="kandidat">
        <div class="profil">
          <img src="zila2.jpeg" alt="" />
          <h1>Kandidat 2</h1>
          <h3>Zila Asza A</h3>

          <div class="detail">
            <button
              style="
                height: 30px;
                width: 110px;
                margin-top: 10px;
                border-radius: 10px;
                background-color: #723238;
                border: 0px;
                font-size: 20px;
              "
            >
              <h4>Detail</h4>
            </button>
          </div>
        </div>
      </div>

      <!-- KANDIDAT 3 -->
      <div class="kandidat">
        <div class="profil">
          <img src="wiwit2.jpeg" alt="" />
          <h1>Kandidat 3</h1>
          <h3>Wiwit Nur S</h3>

          <div class="detail">
            <button
              style="
                height: 30px;
                width: 110px;
                margin-top: 10px;
                border-radius: 10px;
                background-color: #723238;
                border: 0px;
                font-size: 20px;
              "
            >
              <h4>Detail</h4>
            </button>
          </div>
        </div>
      </div>
    </div>

<div class="side-bar">
    <div class="menu">
        <button>Voting</button>
        <button>Hasil Voting</button>
    </div>

    <div class="bottom">
        <div class="user">Hi, 1234!</div>
        <button>Log out</button>
    </div>
</div>
    </div>
  </body>
</html>
