<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    }

      margin-bottom: 10px;
    }
    * {

      padding:0;

        background:#e8d0bf;
        padding:40px;
        border-radius:25px;
        width:380px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);

  </div>
  
  <div class="container">

    <div class="teks">

</div>
