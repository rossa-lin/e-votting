<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Konfirmasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: #f3f3f3;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .popup {
        width: 100%;
        max-width: 500px;
        background: #e8d3c4;
        border: 3px solid #7b2332;
        border-radius: 12px;
        padding: 30px;
        display: flex;
        align-items: center;
        gap: 20px;
    }

   .popup-content {
        flex: 1;
        text-align: center;
    }

    .popup-content h2 {
        color: #8a3a48;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .popup-content p {
        color: #8a3a48;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .popup-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .btn {
        border: none;
        background: #8b1223;
        color: white;
        padding: 8px 24px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }
    
    .btn:hover {
        background: #751F28;
    }
    .logo {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo img {
        width: 90px;
        height: 90px;
        object-fit: contain;
    }

  </style>
</head>
<body>

<div class="popup">
  <div class="logo">
    <img src="logo centang.png" alt="">
  </div>

    <div class="popup-content">
      <h2>Yakin dengan pilihan anda?</h2>
      <p>
        Setelah klik “Simpan” anda tidak dapat<br>
        mengubah pilihan anda.
      </p>

      <div class="popup-buttons">
        <button class="btn">Simpan</button>
        <button class="btn">Batal</button>
      </div>
    </div>
  </div>

</body>
</html>
